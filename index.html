<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="☂️ Build shelters before the storm arrives. Can your creations weather the storm?"
    />
    <!--
      manifest.webmanifest provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />

    <title>Weather Shelter | remarkablegames</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to play this game.</noscript>
    <script type="module" src="/src/index.ts"></script>

    <!--
      Wavedash. See https://docs.wavedash.com/engines/javascript
    -->
    <% if (process.env.WAVEDASH == 'true') { %>
    <script type="module">
      import Wavedash from 'https://esm.sh/@wvdsh/sdk-js@1.3.12';
      Wavedash.updateLoadProgressZeroToOne(1);
      Wavedash.init();
    </script>
    <% } %>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () {
        dataLayer.push(arguments);
      };
      gtag('js', new Date());
    </script>
  </body>
</html>
